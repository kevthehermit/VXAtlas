[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vxatlas"
version = "0.1.0.dev0"
description = "Analysis toolkit for VxWorks 5.x, 6.x and 7.x firmware images (pure-Python core)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vxatlas = "vxatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
