# Build both packages and publish them to PyPI when a GitHub release is published.
#
# Publishing uses PyPI Trusted Publishing, so no API token is stored. Each PyPI
# project (vxatlas and vxatlas-ghidra) must list this workflow and the "pypi"
# environment as a trusted publisher.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # manual run builds and tests only; it does not publish

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine pytest
      - name: Check the release tag matches the package versions
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in core/pyproject.toml ghidra_adapter/pyproject.toml; do
            version=$(grep -m1 '^version = ' "$file" | cut -d'"' -f2)
            if [ "$version" != "$tag" ]; then
              echo "$file has version $version but the release tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done
      - name: Build
        run: |
          python -m build --outdir dist/core core
          python -m build --outdir dist/ghidra ghidra_adapter
          python -m twine check --strict dist/core/* dist/ghidra/*
      - name: Test the built core wheel
        run: |
          python -m pip install dist/core/*.whl
          python -m pytest core/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-core:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core/

  publish-ghidra:
    if: github.event_name == 'release'
    needs: publish-core  # the adapter pins the core version, so the core goes first
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/ghidra/
